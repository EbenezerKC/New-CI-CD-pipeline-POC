name: Glynac Auth CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          docker --version

      - name: Run tests in Python 3.12
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            python:3.12-slim \
            bash -c "pip install --no-cache-dir -r requirements.txt && pytest -v"

      - name: Build Docker image
        run: |
          docker build -t glynac-auth:${GITHUB_SHA} .

      - name: Verify Docker image
        run: |
          docker images glynac-auth
